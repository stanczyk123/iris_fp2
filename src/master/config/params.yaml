# Semua angka tuning ada di sini. Jangan menulis angka langsung di kode node.
# Nama di baris pertama tiap blok HARUS sama dengan nama node-nya.
vision_node:
  ros__parameters:
    source: "rtsp://admin:katsudon1@192.168.51.250:8554/live"
    hsv_lower: [15, 45, 60]
    hsv_upper: [40, 255, 255]
    bev_top_y: 0.38
    bev_bottom_y: 1.0
    bev_top_width: 0.5
    bev_bottom_width: 1.4
    bev_width: 400
    bev_height: 600
    min_area: 1200.0
    bev_offset_x: 0.0
    tampilkan_jendela: false

udp_bridge_node:
  ros__parameters:
    esp32_ip: "192.168.51.200"
    esp32_port: 4210
    listen_port: 4211
    speed_is_rpm: true
    max_speed: 500

master_node:
  ros__parameters:
    loop_hz: 20
    kp: 12.0 #15.0
    max_angle: 20.0 #30.0
    deadband: 0.02
    cruise_speed: 90 #300
    corner_speed: 80 #150
    min_speed: 70 #120
    grace_frames: 15
    lane_timeout_ms: 500
    telemetry_timeout_ms: 500
    require_telemetry: true